services:
  - type: web
    name: ip-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: MONGO_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
